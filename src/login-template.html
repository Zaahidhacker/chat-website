<div class="post-login">
  <header class="post-mast">
    <div class="wordmark"><span class="post-mark" aria-hidden="true">✳︎</span> Our Little Universe</div>
    <button class="sky-switch" type="button" data-action="ambient-mode" aria-label="Toggle celestial lighting" title="Toggle celestial lighting">☼</button>
  </header>
  <main class="post-layout">
    <section class="post-cover" data-purpose="hero-narrative">
      <div class="post-caption"><span>Private correspondence</span><span>Est. 2026</span></div>
      <h1>One little space.<br>Two whole worlds.</h1>
      <figure class="post-print" data-purpose="orbit-illustration">
        <img src="/moon-post.webp" width="1050" height="450" alt="A cobalt crescent hangs above pink, engraved mountain ridges.">
        <figcaption><span>Our Little Universe</span><span class="floating-badge" aria-hidden="true">✦</span></figcaption>
      </figure>
      <div class="post-signature"><span>Just the two of us</span><span data-relationship-days></span></div>
    </section>
    <section class="post-auth" data-purpose="auth-card-container">
      <div class="post-form-wrap">
        <h2>Back to our little world.</h2>
        <p>Sign in to your private conversation.</p>
        <form id="login-form">
          <label for="email">Your email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="password">Your password</label>
          <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" placeholder="Enter your password" required><button type="button" data-action="show-password" aria-label="Show password"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <label class="remember"><input type="checkbox" id="remember-world" checked>Remember our world</label>
          <div id="invite-slot"></div><div id="login-error" role="alert"></div>
          <button class="enter" type="submit">Enter our universe</button>
          <button class="invite" type="button" data-action="invite-mode">First time here? Set your password</button>
        </form>
        <button class="sample" type="button" data-action="demo">Take a peek at a sample universe</button>
      </div>
    </section>
  </main>
  <footer class="post-foot"><span>Invitation only. Made for two.</span><span>Project 28 Studio</span></footer>
</div>
